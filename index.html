<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Cdc · Control dietas cobradas</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%232563eb'/%3E%3Cg transform='translate(-4 -3)' fill='none' stroke='white' stroke-width='5' stroke-linecap='round'%3E%3Cpath d='M44 23A14 14 0 1 0 44 41'/%3E%3Cpath d='M20 28H40M20 36H40' stroke-width='4'/%3E%3C/g%3E%3Ccircle cx='47' cy='47' r='11' fill='%2316a34a' stroke='%232563eb' stroke-width='3'/%3E%3Cpath d='M42 47l4 4 7-8' fill='none' stroke='white' stroke-width='3.2' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<style>
:root{--bg:#f5f6f8;--card:#fff;--tx:#1a1d21;--mut:#6b7280;--ac:#2563eb;--ok:#15803d;--warn:#b45309;--wbg:#fef3c7;--bd:#e5e7eb;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#111418;--card:#1b1f25;--tx:#eceef1;--mut:#9aa3ad;--ac:#60a5fa;--ok:#4ade80;--warn:#fbbf24;--wbg:#3a2e0e;--bd:#2c323a;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#111418;--card:#1b1f25;--tx:#eceef1;--mut:#9aa3ad;--ac:#60a5fa;--ok:#4ade80;--warn:#fbbf24;--wbg:#3a2e0e;--bd:#2c323a;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.4 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
main{max-width:560px;margin:0 auto;padding:16px}
h1{font-size:1.3rem;margin:4px 0 14px}.brand{display:flex;align-items:center;gap:12px;margin:4px 0 16px}.brand svg{width:48px;height:48px;flex:none}.brand b{display:block;font-size:1.6rem;line-height:1;letter-spacing:.5px}.brand span{font-size:.8rem;color:var(--mut)}h2{font-size:1rem;margin:0 0 10px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:14px;margin-bottom:14px}
.alert{background:var(--wbg);border-color:var(--warn);color:var(--tx)}
.alert b{color:var(--warn)}
label{display:block;font-size:.85rem;color:var(--mut);margin:8px 0 3px}
input,button{font:inherit;width:100%;padding:10px;border-radius:10px;border:1px solid var(--bd);background:var(--bg);color:var(--tx)}
button{background:var(--ac);color:#fff;border:0;font-weight:600;margin-top:10px;cursor:pointer}
button.ok{background:var(--ok)}button.ghost{background:transparent;color:var(--mut);border:1px solid var(--bd);width:auto;padding:4px 10px;margin:0;font-weight:400}
.row{display:flex;gap:8px}.row>*{flex:1}
.res{margin-top:10px;padding:10px;border-radius:10px;font-weight:600}
.yes{background:rgba(21,128,61,.15);color:var(--ok)}.no{background:rgba(107,114,128,.15);color:var(--mut)}
.item{display:flex;justify-content:space-between;align-items:center;padding:7px 0;border-top:1px solid var(--bd);gap:8px}
.item small{color:var(--mut);display:block}
.tag{font-size:.75rem;padding:2px 8px;border-radius:99px;background:var(--bd);color:var(--mut)}.tag.p{background:var(--wbg);color:var(--warn)}.tag.c{background:rgba(21,128,61,.15);color:var(--ok)}
.hd{display:flex;justify-content:space-between;align-items:center;gap:8px}
details summary{cursor:pointer;color:var(--mut)}
</style>
</head>
<body>
<main>
<div class="brand"><svg viewBox="0 0 64 64" role="img" aria-label="Logo Cdc"><rect width="64" height="64" rx="14" fill="#2563eb"/><g transform="translate(-4 -3)" fill="none" stroke="#fff" stroke-width="5" stroke-linecap="round"><path d="M44 23A14 14 0 1 0 44 41"/><path d="M20 28H40M20 36H40" stroke-width="4"/></g><circle cx="47" cy="47" r="11" fill="#16a34a" stroke="#2563eb" stroke-width="3"/><path d="M42 47l4 4 7-8" fill="none" stroke="#fff" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/></svg><div><b>Cdc</b><span>Control dietas cobradas</span></div></div>
<div id="alerts"></div>

<div class="card">
<h2>Nuevo desplazamiento</h2>
<label for="d">Fecha</label><input type="date" id="d">
<label for="t">Población</label><input id="t" list="tl" placeholder="Ej. Ronda" autocomplete="off"><datalist id="tl"></datalist>
<label for="k">Km (se calculan solos; puedes corregirlos)</label><input type="number" id="k" min="0" step="1" inputmode="numeric" placeholder="Km desde calle Tucídides">
<div id="r"></div>
<button id="add">Guardar</button>
</div>

<div id="months"></div>

<div class="card"><details><summary>Ajustes</summary>
<div class="row"><div><label for="sr">€ por dieta</label><input type="number" id="sr" step="0.5"></div><div><label for="sk">Km mínimos</label><input type="number" id="sk"></div></div>
<label for="sf">Factor carretera (km reales ≈ línea recta × factor)</label><input type="number" id="sf" step="0.05">
<p style="font-size:.8rem;color:var(--mut)">Los km son una estimación: distancia en línea recta desde Málaga × factor. Si una población queda cerca de 40 km, escribe los km reales de tu navegador. Si la población no está en la lista, escribe los km a mano.</p>
</details></div>
</main>
<script>
var KEY="dietas_v1",MES=["enero","febrero","marzo","abril","mayo","junio","julio","agosto","septiembre","octubre","noviembre","diciembre"];
var ORIGIN=[36.69,-4.47];
var T={"Alhaurín de la Torre":[36.6636,-4.5608],"Alhaurín el Grande":[36.6428,-4.6836],"Cártama":[36.7117,-4.6317],"Coín":[36.6597,-4.7567],"Pizarra":[36.7692,-4.7089],"Álora":[36.8283,-4.7003],"Torremolinos":[36.62,-4.4998],"Benalmádena":[36.5953,-4.5163],"Fuengirola":[36.54,-4.6247],"Mijas":[36.5958,-4.6372],"Marbella":[36.5099,-4.8862],"Estepona":[36.4276,-5.1459],"Manilva":[36.377,-5.25],"Casares":[36.444,-5.274],"Ronda":[36.7423,-5.1671],"Antequera":[37.0194,-4.5615],"Vélez-Málaga":[36.775,-4.1],"Torrox":[36.758,-3.95],"Nerja":[36.746,-3.875],"Algarrobo":[36.768,-4.042],"Rincón de la Victoria":[36.715,-4.276],"Archidona":[37.096,-4.389],"Campillos":[37.045,-4.849],"Fuente de Piedra":[37.137,-4.732],"Ardales":[36.88,-4.848],"Casabermeja":[36.88,-4.429],"Colmenar":[36.897,-4.341],"Cuevas de San Marcos":[37.215,-4.322],"Loja":[37.169,-4.15],"Alhama de Granada":[37.0,-3.988],"Estepa":[37.293,-4.879],"Osuna":[37.237,-5.103],"Écija":[37.542,-5.078],"Lucena":[37.4088,-4.4853],"Puente Genil":[37.389,-4.767],"Sevilla":[37.3891,-5.9845],"Granada":[37.1773,-3.5986],"Córdoba":[37.8882,-4.7794],"Cádiz":[36.5271,-6.2886],"Jerez de la Frontera":[36.685,-6.126],"Jaén":[37.7796,-3.7849],"Almería":[36.8381,-2.4597],"Algeciras":[36.1408,-5.4562],"Motril":[36.75,-3.52]};
var S={set:{rate:15,km:40,factor:1.3},rec:[],paid:{}};
try{var s=localStorage.getItem(KEY);if(s){var o=JSON.parse(s);S.set=Object.assign(S.set,o.set||{});S.rec=o.rec||[];S.paid=o.paid||{}}}catch(e){}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
function $(i){return document.getElementById(i)}
function norm(x){return x.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"").trim()}
function find(n){var q=norm(n);for(var k in T){if(norm(k)===q)return k}return null}
function est(n){var k=find(n);if(!k)return null;var a=T[k],R=6371,r=Math.PI/180;
var dl=(a[0]-ORIGIN[0])*r,dn=(a[1]-ORIGIN[1])*r;
var h=Math.sin(dl/2)*Math.sin(dl/2)+Math.cos(ORIGIN[0]*r)*Math.cos(a[0]*r)*Math.sin(dn/2)*Math.sin(dn/2);
return Math.round(2*R*Math.asin(Math.sqrt(h))*S.set.factor)}
function eur(n){return n.toLocaleString("es-ES",{minimumFractionDigits:0,maximumFractionDigits:2})+" €"}
function mk(d){return d.slice(0,7)}
function mlabel(k){var p=k.split("-");return MES[+p[1]-1]+" "+p[0]}
function nextKey(k){var p=k.split("-"),y=+p[0],m=+p[1]+1;if(m>12){m=1;y++}return y+"-"+(m<10?"0":"")+m}
function prevKey(y,m){m--;if(m<1){m=12;y--}return y+"-"+(m<10?"0":"")+m}
function today(){var n=new Date();return n.getFullYear()+"-"+("0"+(n.getMonth()+1)).slice(-2)+"-"+("0"+n.getDate()).slice(-2)}

var dl=$("tl");for(var k in T){var op=document.createElement("option");op.value=k;dl.appendChild(op)}
$("d").value=today();
$("sr").value=S.set.rate;$("sk").value=S.set.km;$("sf").value=S.set.factor;
["sr","sk","sf"].forEach(function(id){$(id).addEventListener("change",function(){
 var r=parseFloat($("sr").value),k=parseFloat($("sk").value),f=parseFloat($("sf").value);
 if(r>=0)S.set.rate=r;if(k>=0)S.set.km=k;if(f>0)S.set.factor=f;save();upd();render()})});

function upd(){var km=parseFloat($("k").value),box=$("r");
 if(isNaN(km)){box.innerHTML="";return}
 var yes=km>S.set.km;
 box.innerHTML='<div class="res '+(yes?"yes":"no")+'">'+(yes?"✅ Hay dieta: "+eur(S.set.rate):"Sin dieta ("+km+" km, mínimo más de "+S.set.km+")")+"</div>"}
$("t").addEventListener("input",function(){var e=est($("t").value);if(e!==null){$("k").value=e}upd()});
$("k").addEventListener("input",upd);

$("add").addEventListener("click",function(){
 var t=$("t").value.trim(),km=parseFloat($("k").value),d=$("d").value;
 if(!d||!t||isNaN(km)){alert("Indica fecha, población y km.");return}
 S.rec.push({id:Date.now(),d:d,t:find(t)||t,km:km,dieta:km>S.set.km});
 save();$("t").value="";$("k").value="";upd();render()});

function remove(id){S.rec=S.rec.filter(function(r){return r.id!==id});save();render()}
function confirmMonth(k){S.paid[k]=today();save();render()}
function undo(k){delete S.paid[k];save();render()}
window.remove=remove;window.confirmMonth=confirmMonth;window.undo=undo;

function render(){
 var by={};S.rec.forEach(function(r){var k=mk(r.d);(by[k]=by[k]||[]).push(r)});
 var keys=Object.keys(by).sort().reverse();
 function cnt(k){return by[k].filter(function(r){return r.dieta}).length}
 var n=new Date(),dd=n.getDate(),y=n.getFullYear(),m=n.getMonth()+1,A="";
 var P=null;if(dd>=25)P=y+"-"+(m<10?"0":"")+m;else if(dd<=5)P=prevKey(y,m);
 if(P){var due=prevKey(+P.split("-")[0],+P.split("-")[1]);
  if(by[due]&&cnt(due)>0&&!S.paid[due]){var c=cnt(due);
   A='<div class="card alert"><b>💶 Toca cobrar las dietas de '+mlabel(due)+'</b><br>'+c+' dieta'+(c>1?"s":"")+' × '+eur(S.set.rate)+' = <b>'+eur(c*S.set.rate)+'</b><br>Revisa que aparezcan en la nómina de '+mlabel(P)+'.<button class="ok" onclick="confirmMonth(\''+due+'\')">Ya lo he cobrado en nómina</button></div>'}}
 $("alerts").innerHTML=A;
 var H="";
 keys.forEach(function(k){var c=cnt(k),paid=S.paid[k],pk=nextKey(k);
  H+='<div class="card"><div class="hd"><h2>'+mlabel(k)+'</h2>'+(c>0?(paid?'<span class="tag c">Cobrado</span>':'<span class="tag p">Pendiente: nómina de '+mlabel(pk)+'</span>'):'<span class="tag">Sin dietas</span>')+'</div>'
  +'<div style="margin-bottom:6px"><b>'+c+'</b> dieta'+(c===1?"":"s")+' = <b>'+eur(c*S.set.rate)+'</b></div>';
  by[k].sort(function(a,b){return a.d<b.d?1:-1}).forEach(function(r){
   H+='<div class="item"><div>'+r.d.split("-").reverse().join("/")+' · '+esc(r.t)+'<small>'+r.km+' km · '+(r.dieta?"con dieta":"sin dieta")+'</small></div><button class="ghost" onclick="remove('+r.id+')" aria-label="Borrar">✕</button></div>'});
  if(c>0&&paid)H+='<div style="margin-top:8px"><button class="ghost" onclick="undo(\''+k+'\')">Marcar como no cobrado</button></div>';
  H+='</div>'});
 $("months").innerHTML=H}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
render();
</script>
</body>
</html>
